[build-system]
requires = ["setuptools", "Cython", "numpy"]
build-backend = "setuptools.build_meta"
[project]
name = "caputo-derivatives"
version = "0.0.1"
authors = [{ name = "Will Zhang", email = "willwz@umich.edu" }]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "Cython>=0.20.0",
    "numpy>=1.20.1",
    "scipy-stubs[scipy]",
    "setuptools",
]
[tool.setuptools.package-data]
caputo_derivatives = ["*.mat"]
